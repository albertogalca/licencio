cozy:
  name: Cozy
  slug: cozy
  bundle_identifier: com.cantimplora.cozy
  license_prefix: COZY
  # Cozy sells unlimited seats — no per-license cap by default (nil = unlimited).
  update_policy: lifetime
  api_key: prod_cozy_apikey
  loops_api_key: loops_secret_cozy
  loops_transactional_id: tmpl_cozy
  sender_email: hello@cozy.example
  eddsa_private_key: cozy_private_key
  eddsa_public_key: cozy_public_key

picmal:
  name: Picmal
  slug: picmal
  bundle_identifier: com.cantimplora.picmal
  license_prefix: PICM
  max_activations_default: 5
  update_policy: time_limited
  update_duration_days: 365
  api_key: prod_picmal_apikey
  stripe_product_id: prod_picmal_stripe
  stripe_secret_key: sk_test_picmal
  stripe_webhook_secret: whsec_picmal
  checkout_success_url: https://picmal.example/thanks
  checkout_cancel_url: https://picmal.example/pricing
  loops_transactional_id: tmpl_picmal
  student_transactional_id: tmpl_picmal_student
  student_discount_code: STUDENT
  eddsa_private_key: picmal_private_key
  eddsa_public_key: picmal_public_key
